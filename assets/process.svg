<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="220" viewBox="0 0 1250 220"><rect width="1250" height="220" rx="22" fill="#f7fafc"/><rect x="27" y="45" width="220" height="120" rx="17" fill="#e5f4ec"/><text x="137" y="101" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#21435d">Choose K</text><text x="137" y="133" text-anchor="middle" font-family="Arial" font-size="14" fill="#55718b">STEP 1</text><rect x="276" y="45" width="220" height="120" rx="17" fill="#e2ecf4"/><text x="386" y="101" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#21435d">Initialize centers</text><text x="386" y="133" text-anchor="middle" font-family="Arial" font-size="14" fill="#55718b">STEP 2</text><rect x="525" y="45" width="220" height="120" rx="17" fill="#e5f4ec"/><text x="635" y="101" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#21435d">Assign flowers</text><text x="635" y="133" text-anchor="middle" font-family="Arial" font-size="14" fill="#55718b">STEP 3</text><rect x="774" y="45" width="220" height="120" rx="17" fill="#e2ecf4"/><text x="884" y="101" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#21435d">Update centers</text><text x="884" y="133" text-anchor="middle" font-family="Arial" font-size="14" fill="#55718b">STEP 4</text><rect x="1023" y="45" width="220" height="120" rx="17" fill="#e5f4ec"/><text x="1133" y="101" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#21435d">Repeat</text><text x="1133" y="133" text-anchor="middle" font-family="Arial" font-size="14" fill="#55718b">STEP 5</text><text x="625" y="202" text-anchor="middle" font-family="Arial" fill="#536a7a" font-size="17">K-Means repeatedly reduces distances between each flower and its assigned center.</text></svg>