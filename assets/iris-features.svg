<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="295" viewBox="0 0 1020 295"><rect width="1020" height="295" fill="#f7fafc" rx="20"/><text x="38" y="45" font-family="Arial" font-size="23" font-weight="bold" fill="#253c55">Four numbers describe each flower</text><rect x="35" y="85" width="223" height="150" rx="16" fill="#e2eef8"/><text x="146" y="142" text-anchor="middle" font-family="Arial" font-size="19" fill="#253c55" font-weight="bold">Sepal length</text><text x="146" y="179" text-anchor="middle" font-family="Arial" font-size="16" fill="#50637b">Measured in cm</text><rect x="282" y="85" width="223" height="150" rx="16" fill="#e4f5ed"/><text x="393" y="142" text-anchor="middle" font-family="Arial" font-size="19" fill="#253c55" font-weight="bold">Sepal width</text><text x="393" y="179" text-anchor="middle" font-family="Arial" font-size="16" fill="#50637b">Measured in cm</text><rect x="529" y="85" width="223" height="150" rx="16" fill="#faf0dc"/><text x="640" y="142" text-anchor="middle" font-family="Arial" font-size="19" fill="#253c55" font-weight="bold">Petal length</text><text x="640" y="179" text-anchor="middle" font-family="Arial" font-size="16" fill="#50637b">Measured in cm</text><rect x="776" y="85" width="223" height="150" rx="16" fill="#f2e8fa"/><text x="887" y="142" text-anchor="middle" font-family="Arial" font-size="19" fill="#253c55" font-weight="bold">Petal width</text><text x="887" y="179" text-anchor="middle" font-family="Arial" font-size="16" fill="#50637b">Measured in cm</text><text x="38" y="268" font-family="Arial" font-size="15" fill="#51677c">These four numeric measurements are the model inputs. Species names are excluded from training.</text></svg>